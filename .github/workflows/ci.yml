name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIN_PHP: '8.2'

jobs:
  test:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l
      # Plain PHP with hand-rolled stubs, so there is nothing to install.
      - name: Run the test suites
        run: |
          php tests/test-updater.php
          php tests/test-analytics.php

  standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      - name: Install PHPCS and the WordPress rulesets
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer:^3.9 \
            wp-coding-standards/wpcs:^3.1 \
            phpcompatibility/phpcompatibility-wp:^2.1
          composer global config bin-dir --absolute -q >> "$GITHUB_PATH"

      # BLOCKING. Finds real portability bugs: syntax or functions that do not
      # exist on the minimum PHP version the plugin header claims.
      - name: PHP version compatibility
        run: |
          phpcs -q --standard=PHPCompatibilityWP \
            --runtime-set testVersion "${{ env.MIN_PHP }}-" \
            --extensions=php --ignore=vendor/*,node_modules/* \
            --report=checkstyle . | cs2pr

      # ADVISORY on purpose. WordPress-Extra is house style as much as
      # correctness, and enabling it over an existing codebase produces hundreds
      # of findings on day one. A red X on every push gets switched off, and then
      # nothing is checked. Tighten to blocking once the backlog is cleared.
      - name: WordPress coding standards (advisory)
        continue-on-error: true
        run: |
          phpcs -q --standard=WordPress-Extra \
            --extensions=php --ignore=vendor/*,node_modules/*,tests/* \
            --report=checkstyle . | cs2pr
